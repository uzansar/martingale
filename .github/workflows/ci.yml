name: C++20 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC (Release)
            cc: gcc
            cxx: g++
            build_type: Release
            asan: "OFF"
            ubsan: "OFF"
          - name: GCC (Debug + ASan/UBSan)
            cc: gcc
            cxx: g++
            build_type: Debug
            asan: "ON"
            ubsan: "ON"
          - name: Clang (Release)
            cc: clang
            cxx: clang++
            build_type: Release
            asan: "OFF"
            ubsan: "OFF"
          - name: Clang (Debug + ASan/UBSan)
            cc: clang
            cxx: clang++
            build_type: Debug
            asan: "ON"
            ubsan: "ON"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ninja build system
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build

      - name: Configure CMake
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DMARTINGALE_BUILD_TESTS=ON \
            -DMARTINGALE_WARNINGS_AS_ERRORS=ON \
            -DMARTINGALE_ENABLE_ASAN=${{ matrix.asan }} \
            -DMARTINGALE_ENABLE_UBSAN=${{ matrix.ubsan }}

      - name: Build
        run: cmake --build build

      - name: Run CTest Suite
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure -V
